name: Build Rider APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-rider/**'
      - 'packages/shared/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-rider

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.0
          cache: npm

      - run: npm ci
        working-directory: .

      - name: EAS Build
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        run: eas build --profile preview --platform android --non-interactive --no-wait

      - name: Push EAS Update
        run: eas update --branch preview --message "${{ github.event.head_commit.message }}" --non-interactive
