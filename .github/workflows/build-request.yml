name: Build Request APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile-request/**'
      - 'packages/shared/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-request

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # eas-cli (installed below as "latest") needs Node 22+. The app build
          # itself runs on EAS with the Node version set in eas.json.
          node-version: 22
          cache: npm

      - run: npm ci
        working-directory: .

      - name: EAS Build
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build preview APK
        run: eas build --profile preview --platform android --non-interactive --no-wait

      - name: Push EAS Update
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Bundle with the preview profile's settings (API URL, Google keys);
          # the runner has no .env file.
          eval "$(node -e "const e=require('./eas.json').build.preview.env; for (const [k, v] of Object.entries(e)) console.log('export ' + k + '=' + JSON.stringify(v))")"
          # Manual runs have no commit message; use the first line when there is one.
          MESSAGE="${COMMIT_MESSAGE%%$'\n'*}"
          eas update --branch preview --environment preview --message "${MESSAGE:-Manual run at ${GITHUB_SHA::7}}" --non-interactive
