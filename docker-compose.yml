services:
  postgres:
    image: postgres:16-alpine
    container_name: benbax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: benbax
      POSTGRES_PASSWORD: benbax
      POSTGRES_DB: benbax_go
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benbax -d benbax_go"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: benbax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/docker/Dockerfile
    container_name: benbax-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    ports:
      - "4000:4000"

volumes:
  postgres-data:
  redis-data:
